name: Auto-update MeshMonitor version

on:
  schedule:
    - cron: '0 6 * * *'  # каждый день в 6:00 UTC
  workflow_dispatch:       # можно запустить вручную

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest MeshMonitor version
        id: meshmonitor
        run: |
          LATEST=$(curl -s https://api.github.com/repos/Yeraze/meshmonitor/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest MeshMonitor version: $LATEST"

      - name: Get current addon version
        id: current
        run: |
          CURRENT=$(grep '^version:' meshmonitor/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current addon version: $CURRENT"

      - name: Update config.yaml if version changed
        if: steps.meshmonitor.outputs.version != steps.current.outputs.version
        run: |
          NEW_VERSION="${{ steps.meshmonitor.outputs.version }}"
          sed -i "s/^version: .*/version: \"${NEW_VERSION}\"/" meshmonitor/config.yaml
          echo "Updated version to $NEW_VERSION"

      - name: Commit and push
        if: steps.meshmonitor.outputs.version != steps.current.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meshmonitor/config.yaml
          git commit -m "chore: update MeshMonitor to v${{ steps.meshmonitor.outputs.version }}"
          git push
