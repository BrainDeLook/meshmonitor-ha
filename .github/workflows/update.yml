name: Auto-update MeshMonitor version

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest MeshMonitor version
        id: meshmonitor
        run: |
          LATEST=$(curl -s https://api.github.com/repos/Yeraze/meshmonitor/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest MeshMonitor version: $LATEST"

      - name: Get current addon version
        id: current
        run: |
          CURRENT=$(grep '^version:' meshmonitor/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current addon version: $CURRENT"

      - name: Update files if version changed
        if: steps.meshmonitor.outputs.version != steps.current.outputs.version
        run: |
          NEW_VERSION="${{ steps.meshmonitor.outputs.version }}"
          DATE=$(date +%Y-%m-%d)

          # Обновляем версию в config.yaml
          sed -i "s/^version: .*/version: \"${NEW_VERSION}\"/" meshmonitor/config.yaml

          # Добавляем запись в CHANGELOG.md через временный файл
          printf "# Changelog\n\n## %s (%s)\n\n- Update to latest version from MeshMonitor (changelog: https://github.com/Yeraze/meshmonitor/releases/tag/v%s)\n\n" \
            "$NEW_VERSION" "$DATE" "$NEW_VERSION" > /tmp/changelog_header.md
          tail -n +2 meshmonitor/CHANGELOG.md >> /tmp/changelog_header.md
          mv /tmp/changelog_header.md meshmonitor/CHANGELOG.md

          echo "Updated to $NEW_VERSION"

      - name: Commit and push
        if: steps.meshmonitor.outputs.version != steps.current.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meshmonitor/config.yaml meshmonitor/CHANGELOG.md
          git commit -m "chore: update MeshMonitor to v${{ steps.meshmonitor.outputs.version }}"
          git push
