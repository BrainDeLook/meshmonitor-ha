name: BelRailWatcher temporary CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify BelRailWatcher source
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            a7e970a5d0b97aa153c64d2eadcd4c596278008c2755f4501846ecfcbb651e42
            a650f9af23f15e967121af8000808f2d934d63143d7b84644e74f2fc746f0f95
            93b7675f82360611479a81dfe90ef21b2be4e69e202dc9420ba34100b27735ee
            8b7b18ac2567dab2b6b5026c840f35e66efa480b20c9d29fe5ec7333b3ad9176
            c866072097065454de00e2ae05e22ea4e41b7f2f2b16944fe71b4c8c41a1aa7a
            40e155cc8da64a0944257c5b584bc02b955740c16a4babe858dc014974be30cb
            46919f0bb92deb847e81b2bdd4389bb0bc8caf5b2b8a2b3777fe6e26bfdb064a
            99adec277da243b084af5aca6ce89b952ebcb2b768982f90bc13b0a536b14ac9
            54e78b93f98281a569d979e3b4544ddad051c3c4c3220d50e6ff03d489e31243
            6f5b24bf0b789b46836b5a6e120c86814f7f39a17d8898dc9f988a975db6d7f4
            478fe16aeca47b176b37359b91a5770dd5eb768421dfbd1555ed2e8f7f823d68
          )
          : > /tmp/belrail.b64
          idx=0
          for i in 00 01 02 03 04 05 06 07 08 09 10; do
            curl -fsSL "https://raw.githubusercontent.com/BrainDeLook/default/belrailwatcher-build/belrailwatcher-build/chunks2/chunk${i}" -o "/tmp/chunk${i}"
            actual=$(sha256sum "/tmp/chunk${i}" | awk '{print $1}')
            echo "chunk${i}: $(wc -c < /tmp/chunk${i}) bytes $actual"
            test "$actual" = "${expected[$idx]}"
            cat "/tmp/chunk${i}" >> /tmp/belrail.b64
            idx=$((idx+1))
          done
          test "$(wc -c < /tmp/belrail.b64)" -eq 86572
          echo "e3ad568315f63bfe2773b8e55602863e2f7278918010511c6afdf225381316c0  /tmp/belrail.b64" | sha256sum -c -
          base64 -d /tmp/belrail.b64 > /tmp/belrail.zip
          echo "629b3a89585350c62dca0eb868f3b0e26628544c162ad33520f0d1160474b12a  /tmp/belrail.zip" | sha256sum -c -
          unzip -t /tmp/belrail.zip
          mkdir -p /tmp/belrail
          unzip -q /tmp/belrail.zip -d /tmp/belrail
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and test
        working-directory: /tmp/belrail/BelRailWatcher
        env:
          RW_USER_KEY: c2a3d81674b7f4c9e4af16bdba110d53
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          APK=/tmp/belrail/BelRailWatcher/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner verify --verbose "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: BelRailWatcher-0.4-debug
          path: /tmp/belrail/BelRailWatcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
