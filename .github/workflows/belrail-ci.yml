name: BelRailWatcher temporary CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify BelRailWatcher source
        shell: bash
        run: |
          set -euo pipefail
          files=(00 01 02 03 04 05 06a 06b 07 08 09 10)
          expected=(
            a7e970a5d0b97aa153c64d2eadcd4c596278008c2755f4501846ecfcbb651e42
            a650f9af23f15e967121af8000808f2d934d63143d7b84644e74f2fc746f0f95
            93b7675f82360611479a81dfe90ef21b2be4e69e202dc9420ba34100b27735ee
            8b7b18ac2567dab2b6b5026c840f35e66efa480b20c9d29fe5ec7333b3ad9176
            c866072097065454de00e2ae05e22ea4e41b7f2f2b16944fe71b4c8c41a1aa7a
            40e155cc8da64a0944257c5b584bc02b955740c16a4babe858dc014974be30cb
            ffdd460dc7ac302b7e15d53afbdef6477784eb7af76359f179b3fb9852704592
            e2e5a88394900771ad556667ee8134da2c1a08eaada8d636bbb503b7c26a2306
            99adec277da243b084af5aca6ce89b952ebcb2b768982f90bc13b0a536b14ac9
            54e78b93f98281a569d979e3b4544ddad051c3c4c3220d50e6ff03d489e31243
            6f5b24bf0b789b46836b5a6e120c86814f7f39a17d8898dc9f988a975db6d7f4
            478fe16aeca47b176b37359b91a5770dd5eb768421dfbd1555ed2e8f7f823d68
          )
          : > /tmp/belrail.b64
          for idx in "${!files[@]}"; do
            i="${files[$idx]}"
            curl -fsSL "https://raw.githubusercontent.com/BrainDeLook/default/belrailwatcher-build/belrailwatcher-build/chunks2/chunk${i}" -o "/tmp/chunk${i}"
            actual=$(sha256sum "/tmp/chunk${i}" | awk '{print $1}')
            echo "chunk${i}: $(wc -c < /tmp/chunk${i}) bytes $actual"
            test "$actual" = "${expected[$idx]}"
            cat "/tmp/chunk${i}" >> /tmp/belrail.b64
          done
          test "$(wc -c < /tmp/belrail.b64)" -eq 86572
          echo "e3ad568315f63bfe2773b8e55602863e2f7278918010511c6afdf225381316c0  /tmp/belrail.b64" | sha256sum -c -
          base64 -d /tmp/belrail.b64 > /tmp/belrail.zip
          echo "629b3a89585350c62dca0eb868f3b0e26628544c162ad33520f0d1160474b12a  /tmp/belrail.zip" | sha256sum -c -
          unzip -t /tmp/belrail.zip
          mkdir -p /tmp/belrail
          unzip -q /tmp/belrail.zip -d /tmp/belrail

      - name: Patch v0.4.2 JWT auth semantics
        shell: bash
        working-directory: /tmp/belrail/BelRailWatcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          models = Path('app/src/main/java/com/example/belrailwatcher/model/Models.kt')
          s = models.read_text()
          old = '''data class AccountSession(
              val accessToken: String,
              val jwt: String,
              val refreshToken: String = ""
          ) {
              val isUsable: Boolean get() = accessToken.isNotBlank()
          }
          '''
          new = '''data class AccountSession(
              val accessToken: String,
              val jwt: String,
              val refreshToken: String = ""
          ) {
              val bearerToken: String get() = jwt.ifBlank { accessToken }
              val isUsable: Boolean get() = bearerToken.isNotBlank()
          }
          '''
          if old not in s:
              raise SystemExit('AccountSession block not found')
          models.write_text(s.replace(old, new))

          api = Path('app/src/main/java/com/example/belrailwatcher/net/RwAccountApi.kt')
          s = api.read_text()
          s = s.replace('bearer = session.accessToken', 'bearer = session.bearerToken')

          old_login = '''        requireSuccess(response, authCall = true)
                  return parseSession(response.body)
                      ?: throw RwApiException(extractMessage(response.body).ifBlank { "БелЖД не вернул токен авторизации" })
          '''
          new_login = '''        requireSuccess(response, authCall = true)
                  return parseSession(response.body) ?: run {
                      val root = runCatching { JSONObject(response.body) }.getOrNull()
                      val apiStatus = root?.optInt("status", 0) ?: 0
                      val message = extractMessage(response.body)
                      val suffix = if (apiStatus != 0) " (status=$apiStatus)" else ""
                      throw RwApiException(message.ifBlank { "БелЖД не вернул JWT авторизации$suffix" })
                  }
          '''
          if old_login not in s:
              raise SystemExit('login block not found')
          s = s.replace(old_login, new_login)

          old_parser = '''    internal fun parseSession(body: String): AccountSession? {
                  val root = runCatching { JSONObject(body) }.getOrNull() ?: return null
                  val auth = root.optJSONObject("auth") ?: root.optJSONObject("data")?.optJSONObject("auth") ?: root
                  val access = firstString(auth, "accessToken", "access_token", "token")
                  val jwt = firstString(auth, "jwt", "jwtToken", "jwt_token")
                  val refresh = firstString(auth, "refreshToken", "refresh_token")
                  if (access.isBlank()) return null
                  return AccountSession(accessToken = access, jwt = jwt, refreshToken = refresh)
              }
          '''
          new_parser = '''    internal fun parseSession(body: String): AccountSession? {
                  val root = runCatching { JSONObject(body) }.getOrNull() ?: return null
                  val apiStatus = root.optInt("status", 200)
                  if (apiStatus != 200) return null
                  val auth = root.optJSONObject("auth") ?: root.optJSONObject("data")?.optJSONObject("auth") ?: root
                  val access = firstString(auth, "accessToken", "access_token", "token")
                  val jwt = firstString(auth, "jwt", "jwtToken", "jwt_token")
                  val refresh = firstString(auth, "refreshToken", "refresh_token")
                  if (jwt.isBlank() && access.isBlank()) return null
                  return AccountSession(accessToken = access, jwt = jwt, refreshToken = refresh)
              }
          '''
          if old_parser not in s:
              raise SystemExit('parseSession block not found')
          api.write_text(s.replace(old_parser, new_parser))

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text().replace('versionCode = 4', 'versionCode = 6').replace('versionName = "0.4.0"', 'versionName = "0.4.2"')
          gradle.write_text(s)

          consts = Path('app/src/main/java/com/example/belrailwatcher/net/RwConstants.kt')
          consts.write_text(consts.read_text().replace('BelRailWatcher/0.4 Android', 'BelRailWatcher/0.4.2 Android'))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and test
        working-directory: /tmp/belrail/BelRailWatcher
        env:
          RW_USER_KEY: c0f1de1cbcf6c517baa7c95ab7d0509e
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          APK=/tmp/belrail/BelRailWatcher/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner verify --verbose "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: BelRailWatcher-0.4.2-debug
          path: /tmp/belrail/BelRailWatcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
